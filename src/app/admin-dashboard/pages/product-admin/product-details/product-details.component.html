<h1 class="text-2xl font-bold">{{ product().title }}</h1>
<div class="divider"></div>

<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  <!-- Datos generales -->
  <div class="flex flex-col gap-2">
    <h2 class="text-2xl font-bold h-12">Datos generales</h2>
    <input
      type="text"
      placeholder="Título"
      class="input input-bordered w-full"
      formControlName="title"
      [class.border-red-500]="productForm.get('title')?.errors ?? false"
    />
    <label-form-error [control]="productForm.get('title')!" />

    <input formControlName="slug" type="text" placeholder="Slug"
    class="input input-bordered w-full" [class.border-red-500]="productForm.get('slug')?.errors ?? false"
    />
    <label-form-error [control]="productForm.get('slug')!" />

    <textarea
      class="textarea textarea-bordered"
      placeholder="Descripción"
      rows="6"
      formControlName="description"
    [class.border-red-500]="productForm.get('description')?.errors ?? false"
    ></textarea>
    <label-form-error [control]="productForm.get('description')!" />

    <h2 class="text-lg font-bold">Datos de venta</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      <input
        type="number"
        placeholder="Precio"
        class="input input-bordered w-full"
        formControlName="price"
      [class.border-red-500]="productForm.get('price')?.errors ?? false"
    />
    <label-form-error [control]="productForm.get('price')!" />

      <input
        type="number"
        placeholder="Inventario"
        class="input input-bordered w-full"
        formControlName="stock"
      [class.border-red-500]="productForm.get('stock')?.errors ?? false"
    />
    <label-form-error [control]="productForm.get('stock')!" />

    </div>

    <!-- tags -->
    <input type="text" formControlName="tags" placeholder="Tags"
    class="input input-bordered w-full" [class.border-red-500]="productForm.get('tags')?.errors ?? false"
    />
    <label-form-error [control]="productForm.get('tags')!" />

    <!-- Botones para el género -->
    <div class="grid grid-cols-4 gap-2">
      <!-- <button class="btn btn-sm btn-outline">Masculino</button> -->
      <button type="button"
      (click)="productForm.patchValue({ gender: 'men' })"
      class="btn btn-sm"
      [class.btn-primary]="productForm.value.gender === 'men'">
      Masculino</button>
      <button type="button"
      (click)="productForm.patchValue({ gender: 'women' })"
      class="btn btn-sm"
      [class.btn-accent]="productForm.value.gender === 'women'">
      Femenino</button>
      <button type="button"
      (click)="productForm.patchValue({ gender: 'kid' })"
      class="btn btn-sm"
      [class.btn-warning]="productForm.value.gender === 'kid'"
      >
      Kid</button>
      <button type="button"
      (click)="productForm.patchValue({ gender: 'unisex' })"
      class="btn btn-sm"
      [class.btn-secondary]="productForm.value.gender === 'unisex'">
      Unisex</button>
    </div>

    <!-- <select class="select select-bordered w-full">
      <option value="male">Masculino</option>
      <option value="female">Femenino</option>
      <option value="unisex">Unisex</option>
    </select> -->

    <!-- Sizes -->
    <div class="grid grid-cols-6 gap-2">
      @for (size of sizes; track size) {
      <button (click)="onSizeClicked(size)" type="button"
      class="btn btn-sm btn-outline"
      [class.btn-secondary]="productForm.value.sizes?.includes(size)"
      >{{ size }}</button>
      }
    </div>
  </div>

  <!-- Imágenes -->
  <div class="flex flex-col gap-2">
    <div class="flex justify-end h-12">
      <button class="btn btn-secondary" type="submit">
        <!-- <span class="loading loading-spinner loading-sm"></span> -->

        Guardar
      </button>
    </div>

    <product-carrousel [images]="product().images" />

    <input type="file" class="file-input file-input-bordered w-full mt-4" />
  </div>
</form>
