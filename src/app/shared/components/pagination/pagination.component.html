<div class="join flex justify-center items-center">
  @for (page of gatPagesList(); track page) {
    <button class="join-item btn" (click)="activePage.set(page)" [class.btn-primary]="page === activePage()" [routerLink]="[]" [queryParams]="{ page: page }">{{ page }}</button>
  }
  @empty {
    <p>No hay paginas</p>
  }
  <button class="join-item btn btn-disabled">...</button>
</div>
